<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <!-- Background Shield Gradient: University Midnight Navy -->
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06152B" />
            <stop offset="50%" stop-color="#092244" />
            <stop offset="100%" stop-color="#051224" />
        </linearGradient>

        <!-- NSBM Green University Gradient (Left Page & Community Arc) -->
        <linearGradient id="nsbmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="45%" stop-color="#00B978" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>

        <!-- Academic Azure Gradient (Right Page & University Arc) -->
        <linearGradient id="academicBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="50%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#1D4ED8" />
        </linearGradient>

        <!-- Upward Achievement / Growth Gradient -->
        <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="100%" stop-color="#F59E0B" />
        </linearGradient>

        <!-- Subtle Ambient Glow -->
        <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00B978" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- Outer Rounded Base Squircle -->
    <rect width="200" height="200" rx="46" fill="url(#shieldGrad)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2.5" />

    <!-- Subtle Inner Border Accent -->
    <rect x="4" y="4" width="192" height="192" rx="42" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" />

    <!-- Group: Study Circle Emblem -->
    <g filter="url(#emeraldGlow)">
        <!-- 1. The Collaborative "Circle" Outer Ring Arcs (Unity & Community) -->
        <!-- Left Green Arc (NSBM Green University Living Growth) -->
        <path d="M 100 24 A 74 74 0 0 0 34 116 A 74 74 0 0 0 100 174" 
              fill="none" 
              stroke="url(#nsbmGreen)" 
              stroke-width="7" 
              stroke-linecap="round" 
              stroke-dasharray="190 20" 
              opacity="0.9" />

        <!-- Right Cyan Arc (Technology & Knowledge Collaboration) -->
        <path d="M 100 24 A 74 74 0 0 1 166 116 A 74 74 0 0 1 100 174" 
              fill="none" 
              stroke="url(#academicBlue)" 
              stroke-width="7" 
              stroke-linecap="round" 
              stroke-dasharray="190 20" 
              opacity="0.9" />

        <!-- 2. The Open Book of Knowledge (Heart of Learning) -->
        <!-- Left Open Leaf (Growth & Study) -->
        <path d="M 100 66 
                 C 86 78 58 78 46 84 
                 C 42 86 40 89 40 94 
                 L 40 134 
                 C 40 137 43 140 46 139 
                 C 60 133 82 131 100 148 Z" 
              fill="url(#nsbmGreen)" />

        <!-- Left Page Inner Contour Highlight -->
        <path d="M 46 94 C 58 89 84 89 97 78 L 97 138 C 82 124 60 126 46 131 Z" 
              fill="rgba(255, 255, 255, 0.15)" />

        <!-- Right Open Leaf (Academic Excellence & Wisdom) -->
        <path d="M 100 66 
                 C 114 78 142 78 154 84 
                 C 158 86 160 89 160 94 
                 L 160 134 
                 C 160 137 157 140 154 139 
                 C 140 133 118 131 100 148 Z" 
              fill="url(#academicBlue)" />

        <!-- Right Page Inner Contour Highlight -->
        <path d="M 154 94 C 142 89 116 89 103 78 L 103 138 C 118 124 140 126 154 131 Z" 
              fill="rgba(255, 255, 255, 0.15)" />

        <!-- Central Spine (Academic Pillar) -->
        <path d="M 100 58 L 107 72 L 100 148 L 93 72 Z" fill="#FFFFFF" opacity="0.95" />

        <!-- 3. Graduation & Learning Achievement Spark (Star / Rising Sun) -->
        <!-- Outer Spark Aura -->
        <circle cx="100" cy="46" r="8" fill="url(#goldSpark)" opacity="0.3" />
        <!-- Core Spark Node -->
        <polygon points="100,36 103.5,43.5 111,46 103.5,48.5 100,56 96.5,48.5 89,46 96.5,43.5" fill="url(#goldSpark)" />
        <circle cx="100" cy="46" r="3" fill="#FFFFFF" />

        <!-- Student Connection Collaborative Dots (Bottom Anchor) -->
        <circle cx="78" cy="162" r="4" fill="#34D399" />
        <circle cx="100" cy="168" r="4.5" fill="#FFFFFF" opacity="0.9" />
        <circle cx="122" cy="162" r="4" fill="#38BDF8" />
    </g>
</svg>